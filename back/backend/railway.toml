# ────────────────────────────────────────────────────────────────
# Railway config — Sofia Couture Backend (Spring Boot)
# ────────────────────────────────────────────────────────────────
# Railway detecta el Dockerfile automáticamente. Este archivo solo
# refina el comportamiento (healthcheck, restart, replicas).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
