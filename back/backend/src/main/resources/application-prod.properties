# ─── PRODUCCIÓN (Render / Railway / genérico) ─────────────────
# Soporta: DB_URL (Render), DATABASE_URL (Railway), o PG* individual (Railway alt)
# Railway inyecta DATABASE_URL como postgresql://user:pass@host:port/db → hay que anteponer jdbc:
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:${DATABASE_URL_JDBC:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sofiacouture}}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:sofiauser}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.com.tiendaropa=INFO
logging.level.root=WARN

# Payphone
payphone.token=${PAYPHONE_TOKEN:}
payphone.store-id=${PAYPHONE_STORE_ID:}
payphone.response-base-url=${PAYPHONE_RESPONSE_BASE_URL:}
